datasets:
  test-dataset-128:
    group: float
    dimension: 128
    num_vectors: 1_000_000
    num_queries: 10_000
    data_type: float32
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

  test-dataset-384:
    group: float
    dimension: 384
    num_vectors: 1_000_000
    num_queries: 50_000
    data_type: float32
    distribution:
      type: normal
      mean: 0.0
      std: 0.1
      normalize: true

  test-dataset-768:
    group: float
    dimension: 768
    num_vectors: 1_000_000
    num_queries: 10_000
    data_type: float32
    distribution:
      type: normal
      mean: 0.0
      std: 0.1
      normalize: true

  # half_float field: uploaded as fp16 (2 bytes/value), read directly by the service
  test-dataset-half-float-fp16:
    group: half_float
    dimension: 128
    num_vectors: 100_000
    num_queries: 1_000
    data_type: float16
    request_data_type: half_float
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

  # float field with the fp16 scalar quantizer: uploaded as fp32 under data_type half_float,
  # converted to fp16 by the service
  test-dataset-half-float-fp32:
    group: half_float
    dimension: 128
    num_vectors: 100_000
    num_queries: 1_000
    data_type: float32
    request_data_type: half_float
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

  # fewer vectors than the default m * 4 graph degree can be built from: exercises the
  # lowered-m path for small builds, like the small flush segments k-NN can send
  test-dataset-small:
    group: small
    dimension: 128
    num_vectors: 150
    num_queries: 100
    data_type: float32
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

generation:
  batch_size: 100_000
  seed: 42
  progress_bar: true

storage:
  s3:
    bucket: test-index-builder
    region: us-east-1
    retries: 3
    paths:
      vectors: "{dataset_name}/vectors.knnvec"
      doc_ids: "{dataset_name}/doc_ids.knndid"