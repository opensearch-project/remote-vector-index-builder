datasets:
  test-dataset-128:
    group: float
    dimension: 128
    num_vectors: 1_000_000
    num_queries: 10_000
    data_type: float32
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

  test-dataset-384:
    group: float
    dimension: 384
    num_vectors: 1_000_000
    num_queries: 50_000
    data_type: float32
    distribution:
      type: normal
      mean: 0.0
      std: 0.1
      normalize: true

  test-dataset-768:
    group: float
    dimension: 768
    num_vectors: 1_000_000
    num_queries: 10_000
    data_type: float32
    distribution:
      type: normal
      mean: 0.0
      std: 0.1
      normalize: true

  # half_float field: uploaded as fp16 (2 bytes/value), read directly by the service
  test-dataset-half-float-fp16:
    group: half_float
    dimension: 128
    num_vectors: 100_000
    num_queries: 1_000
    data_type: float16
    request_data_type: half_float
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

  # float field with the fp16 scalar quantizer: uploaded as fp32 under data_type half_float,
  # converted to fp16 by the service
  test-dataset-half-float-fp32:
    group: half_float
    dimension: 128
    num_vectors: 100_000
    num_queries: 1_000
    data_type: float32
    request_data_type: half_float
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

  # fewer vectors than the default m * 4 graph degree can be built from: exercises the
  # lowered-m path for small builds, like the small flush segments k-NN can send
  test-dataset-small:
    group: small
    dimension: 128
    num_vectors: 150
    num_queries: 100
    data_type: float32
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

  # base_level_only: false on float vectors: faiss builds HNSW upper levels above the CAGRA graph.
  # expect_base_level_only makes the run read the built index back and check its shape
  test-dataset-multi-layer-float:
    group: multi_layer
    dimension: 128
    num_vectors: 100_000
    num_queries: 1_000
    data_type: float32
    algorithm_parameters:
      base_level_only: false
    expect_base_level_only: false
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

  # base_level_only: false on binary vectors: dimension is in bits, but vectors are stored in bytes
  test-dataset-multi-layer-binary:
    group: multi_layer
    dimension: 256
    num_vectors: 100_000
    num_queries: 1_000
    data_type: uint8
    request_data_type: binary
    algorithm_parameters:
      base_level_only: false
    expect_base_level_only: false
    distribution:
      type: random_bits

  # faiss cannot build upper levels for half_float: the request must still succeed, but as a
  # base-level-only build
  test-dataset-multi-layer-half-float-fallback:
    group: multi_layer
    dimension: 128
    num_vectors: 100_000
    num_queries: 1_000
    data_type: float16
    request_data_type: half_float
    algorithm_parameters:
      base_level_only: false
    expect_base_level_only: true
    distribution:
      type: normal
      mean: 0.0
      std: 1.0
      normalize: true

generation:
  batch_size: 100_000
  seed: 42
  progress_bar: true

storage:
  s3:
    bucket: test-index-builder
    region: us-east-1
    retries: 3
    paths:
      vectors: "{dataset_name}/vectors.knnvec"
      doc_ids: "{dataset_name}/doc_ids.knndid"